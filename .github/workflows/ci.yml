name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:quality
      - run: npm run test:account
        env:
          SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
          MVP_ADMIN_EMAIL: admin@example.com
          MVP_ADMIN_PASSWORD: ci-only-admin-password
      - run: npm audit --audit-level=high
      - run: docker build --tag pickleball-risk-ci:${{ github.sha }} .
